---
# role: bind
# file: molecule/multi/verify.yml

- name: "BIND | Verify primary and secondary"
  hosts: bind_multi_primary
  gather_facts: false
  tasks:
    - name: "BIND | Wait for initial zone transfer"
      ansible.builtin.command:
        argv:
          - dig
          - "@{{ bind_multi_secondary_ip }}"
          - example.com
          - SOA
          - +short
          - +tries=1
          - +time=2
      register: __bind_verify_initial_transfer
      changed_when: false
      until:
        - "'ns1.example.com.' in __bind_verify_initial_transfer.stdout"
      retries: 30
      delay: 2

    - name: "BIND | Submit DDNS update on primary"
      community.general.nsupdate:
        server: 127.0.0.1
        key_name: ddns
        key_algorithm: hmac-sha256
        key_secret: "{{ bind_multi_tsig_secret }}"
        zone: example.com
        record: update
        type: A
        ttl: 60
        value: "{{ bind_multi_update_ip }}"
        state: present
      no_log: true

    - name: "BIND | Verify DDNS update on secondary"
      ansible.builtin.command:
        argv:
          - dig
          - "@{{ bind_multi_secondary_ip }}"
          - update.example.com
          - A
          - +short
          - +tries=1
          - +time=2
      register: __bind_verify_secondary_update
      changed_when: false
      until:
        - bind_multi_update_ip in __bind_verify_secondary_update.stdout_lines
      retries: 60
      delay: 2
