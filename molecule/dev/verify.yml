---
# role: bind
# file: molecule/dev/verify.yml

- name: BIND | Verify managed zones after reconverge
  hosts: all
  gather_facts: false
  tasks:
    - name: BIND | Query managed records
      ansible.builtin.command:
        argv:
          - dig
          - '@127.0.0.1'
          - '{{ __bind_test_record.name }}'
          - '{{ __bind_test_record.type }}'
          - +short
          - +tries=1
          - +time=2
      loop:
        - name: www.example.test
          type: A
          answer: 192.0.2.80
        - name: 80.2.0.192.in-addr.arpa
          type: PTR
          answer: www.example.test.
        - name: runtime.ddns.test
          type: A
          answer: 192.0.2.90
      loop_control:
        loop_var: __bind_test_record
        label: '{{ __bind_test_record.name }}'
      register: __bind_test_answer
      changed_when: false
      until:
        - __bind_test_answer.stdout_lines == [__bind_test_record.answer]
      retries: 10
      delay: 1

    - name: BIND | Verify authoritative negative caching TTL
      ansible.builtin.command:
        argv:
          - dig
          - '@127.0.0.1'
          - '{{ __bind_test_negative.name }}'
          - '{{ __bind_test_negative.type }}'
          - +norecurse
          - +noall
          - +comments
          - +authority
          - +tries=1
          - +time=2
      loop:
        - name: missing.example.test
          type: A
          status: NXDOMAIN
          zone: example.test.
        - name: www.example.test
          type: AAAA
          status: NOERROR
          zone: example.test.
        - name: missing.ddns.test
          type: A
          status: NXDOMAIN
          zone: ddns.test.
      loop_control:
        loop_var: __bind_test_negative
        label: '{{ __bind_test_negative.name }} {{ __bind_test_negative.type }}'
      register: __bind_test_negative_answer
      changed_when: false
      failed_when: >-
        __bind_test_negative_answer.rc != 0 or
        __bind_test_negative_answer.stdout is not search('status: ' ~ __bind_test_negative.status ~ ',') or
        __bind_test_negative_answer.stdout is not search(
          '(?m)^' ~ (__bind_test_negative.zone | regex_escape)
          ~ '\s+3600\s+IN\s+SOA\s+.*\s3600$')
