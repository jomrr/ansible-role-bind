---
# role: bind
# file: molecule/rpz/prepare.yml

- name: BIND | Prepare distribution repositories
  ansible.builtin.import_playbook: ../resources/playbooks/prepare.yml

- name: BIND | Prepare controller HTTPS feed
  hosts: localhost
  gather_facts: false
  vars:
    __bind_rpz_fixture_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rpz-https"
  tasks:
    - name: BIND | Create HTTPS fixture directory
      ansible.builtin.file:
        path: "{{ __bind_rpz_fixture_dir }}"
        state: directory
        mode: "0700"

    - name: BIND | Install initial HTTPS feed
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/feed-v1.zone"
        dest: "{{ __bind_rpz_fixture_dir }}/feed.zone"
        mode: "0600"

    - name: BIND | Generate fixture TLS certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - "{{ __bind_rpz_fixture_dir }}/key.pem"
          - -out
          - "{{ __bind_rpz_fixture_dir }}/cert.pem"
          - -subj
          - /CN=localhost
          - -addext
          - subjectAltName=IP:127.0.0.1,DNS:localhost
          - -days
          - "2"
        creates: "{{ __bind_rpz_fixture_dir }}/cert.pem"

    - name: BIND | Check fixture listener is available
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 18443
        state: stopped
        timeout: 1

    - name: BIND | Start controller HTTPS fixture
      ansible.builtin.shell:
        cmd: >-
          echo $$ > server.pid;
          exec openssl s_server -accept 127.0.0.1:18443
          -cert cert.pem -key key.pem -WWW -quiet
        chdir: "{{ __bind_rpz_fixture_dir }}"
      async: 3600
      poll: 0
      changed_when: true

    - name: BIND | Wait for controller HTTPS fixture
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 18443
        timeout: 10
