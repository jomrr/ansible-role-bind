---
# role: bind
# file: tasks/main.yml

- name: "BIND | Set os_family variables"
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"

- name: "BIND | Set distribution variables"
  ansible.builtin.include_vars: "{{ __bind_platform_file }}"
  vars:
    __bind_platform_files:
      files:
        - "{{ ansible_facts.distribution }}.yml"
      paths:
        - "vars"
      skip: true
  loop: "{{ query('ansible.builtin.first_found', __bind_platform_files) }}"
  loop_control:
    loop_var: __bind_platform_file
    label: "{{ __bind_platform_file }}"

- name: "BIND | Validate declarations"
  ansible.builtin.import_tasks: "assert_pre.yml"

- name: "BIND | Set internal facts"
  ansible.builtin.import_tasks: "facts.yml"

- name: "BIND | Validate effective declarations"
  ansible.builtin.import_tasks: "assert.yml"

- name: "BIND | Install packages"
  ansible.builtin.package:
    name: "{{ __bind_packages }}"
    state: present

- name: "BIND | Generate TSIG key files"
  ansible.builtin.template:
    src: "tsig.j2"
    dest: "{{ __bind_tsig_key_dir }}/{{ __bind_tsig_key.name }}.key"
    owner: root
    group: "{{ __bind_group }}"
    mode: "0640"
    backup: true
    validate: "{{ __bind_checkconf_command }}"
  loop: "{{ bind_tsig_keys }}"
  loop_control:
    loop_var: __bind_tsig_key
    label: "{{ __bind_tsig_key.name }}"
  no_log: true
  notify: restart

- name: "BIND | Configure static zone files"
  ansible.builtin.include_tasks: "zone.yml"
  loop: >-
    {{ __bind_effective_zones | selectattr('target_class', 'defined') |
       selectattr('target_class', 'equalto', 'static') | rejectattr('source', 'defined') | list }}
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"

- name: "BIND | Bootstrap dynamic zone files"
  ansible.builtin.template:
    src: "zone.j2"
    dest: "{{ __bind_zone.file_path }}"
    owner: "{{ __bind_zone_targets[__bind_zone.target_class].owner }}"
    group: "{{ __bind_zone_targets[__bind_zone.target_class].group }}"
    mode: "{{ __bind_zone_targets[__bind_zone.target_class].mode }}"
    force: false
    backup: true
    validate: "{{ __bind_checkzone_command }} {{ __bind_zone.name }} %s"
  vars:
    __bind_zone_serial: "1"
  loop: "{{ __bind_effective_zones | selectattr('target_class', 'defined') | selectattr('target_class', 'equalto', 'dynamic') | list }}"
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"
  notify: restart

- name: "BIND | Import source zone files"
  ansible.builtin.include_tasks: "source.yml"
  when: __bind_effective_zones | selectattr('source', 'defined') | list | length > 0

- name: "BIND | Generate main configuration file"
  ansible.builtin.template:
    src: "named.conf.j2"
    dest: "{{ __bind_conf_file }}"
    owner: root
    group: "{{ __bind_group }}"
    mode: "0640"
    backup: true
    validate: "{{ __bind_checkconf_command }}"
  notify: restart

- name: "BIND | Apply configuration changes"
  ansible.builtin.meta: flush_handlers

- name: "BIND | Enable and start service"
  ansible.builtin.systemd_service:
    name: "{{ __bind_service_name }}"
    state: started
    enabled: true

- name: "BIND | Reload changed source zones"
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - "{{ __bind_rndc_command }}"
      - reload
      - "{{ __bind_source_result.__bind_zone.name }}"
      - IN
  loop: "{{ __bind_source_installations.results | default([]) | selectattr('changed') | list }}"
  loop_control:
    loop_var: __bind_source_result
    label: "{{ __bind_source_result.__bind_zone.name }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - __bind_effective_zones | selectattr('source', 'defined') | list | length > 0
