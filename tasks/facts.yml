---
# role: bind
# file: tasks/facts.yml

# Resolved paths are shared by the zone tasks and named.conf.
- name: "BIND | Resolve effective zones"
  ansible.builtin.set_fact:
    __bind_effective_zones: >-
      {%- set __bind_acc = namespace(zones=[]) -%}
      {%- for __bind_zone in bind_zones -%}
        {%- if __bind_zone.type in __bind_zone_target_classes -%}
          {%- set __bind_target_class = __bind_zone_target_classes[__bind_zone.type][__bind_zone.dynamic | default(false) | bool] -%}
          {%- set __bind_target = __bind_zone_targets[__bind_target_class] -%}
          {%- set __bind_enriched = __bind_zone | combine({
                'target_class': __bind_target_class,
                'file_path': __bind_target.path ~ '/' ~ __bind_zone.file
              }) -%}
        {%- else -%}
          {%- set __bind_enriched = __bind_zone -%}
        {%- endif -%}
        {%- set __bind_acc.zones = __bind_acc.zones + [__bind_enriched] -%}
      {%- endfor -%}
      {{ __bind_acc.zones }}
