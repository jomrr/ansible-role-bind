---
# role: bind
# file: tasks/assert_pre.yml

- name: "BIND | Validate TSIG key names"
  ansible.builtin.assert:
    that:
      - __bind_tsig_name is match('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      TSIG key {{ __bind_tsig_name }}: name may contain only letters,
      digits, dots, underscores, and hyphens.
    quiet: true
  loop: "{{ bind_tsig_keys | map(attribute='name') | list }}"
  loop_control:
    loop_var: __bind_tsig_name
    label: "{{ __bind_tsig_name }}"

- name: "BIND | Validate unique TSIG key names"
  ansible.builtin.assert:
    that:
      - >-
        bind_tsig_keys | map(attribute='name') | list | length ==
        bind_tsig_keys | map(attribute='name') | unique | list | length
    fail_msg: "TSIG key names must be unique."
    quiet: true

- name: "BIND | Validate dynamic zones are primary"
  ansible.builtin.assert:
    that:
      - __bind_zone.type == 'primary'
    fail_msg: >-
      Zone {{ __bind_zone.name }}: dynamic: true is only valid for primary
      zones.
    quiet: true
  loop: "{{ bind_zones }}"
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"
  when: __bind_zone.dynamic | default(false) | bool

- name: "BIND | Validate dynamic update mechanisms"
  ansible.builtin.assert:
    that:
      - __bind_zone.type == 'primary'
      - __bind_zone.dynamic | default(false) | bool
    fail_msg: >-
      Zone {{ __bind_zone.name }}: update_policy, allow_update, and
      inline_signing require a dynamic primary zone.
    quiet: true
  loop: "{{ bind_zones }}"
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"
  when: >-
    __bind_zone.update_policy is defined or
    __bind_zone.allow_update is defined or
    (__bind_zone.inline_signing | default(false) | bool)

- name: "BIND | Validate zone file declarations"
  ansible.builtin.assert:
    that:
      - __bind_zone.name is match('^\\S+$')
      - (__bind_zone.file | default('')) is match('^[^/\\s]+$')
      - (__bind_zone.file | default('')) not in ['.', '..']
    fail_msg: "Zone {{ __bind_zone.name }}: name must not contain whitespace; file must be a file name without path separators or whitespace."
    quiet: true
  loop: "{{ bind_zones }}"
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"
  when: __bind_zone.type in __bind_zone_target_classes

- name: "BIND | Validate primary zone base"
  ansible.builtin.assert:
    that:
      - __bind_zone.primary is defined
      - __bind_zone.email is defined
      - __bind_zone.ns_records is defined and __bind_zone.ns_records | length > 0
    fail_msg: "Zone {{ __bind_zone.name }}: primary zones require primary, email, and ns_records."
    quiet: true
  loop: "{{ bind_zones }}"
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"
  when:
    - __bind_zone.type == 'primary'
    - __bind_zone.source is not defined

- name: "BIND | Validate NS records are primary-only"
  ansible.builtin.assert:
    that:
      - __bind_zone.type == 'primary'
    fail_msg: "Zone {{ __bind_zone.name }}: ns_records are only valid on primary zones."
    quiet: true
  loop: "{{ bind_zones }}"
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"
  when: __bind_zone.ns_records is defined

- name: "BIND | Validate records only on static primary zones"
  ansible.builtin.assert:
    that:
      - __bind_zone.type == 'primary'
      - not (__bind_zone.dynamic | default(false) | bool)
    fail_msg: "Zone {{ __bind_zone.name }}: records are only valid on static primary zones."
    quiet: true
  loop: "{{ bind_zones }}"
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"
  when: __bind_zone.records is defined

- name: "BIND | Validate source zone declarations"
  ansible.builtin.assert:
    that:
      - __bind_zone.type == 'primary'
      - (__bind_zone.source.url | ansible.builtin.urlsplit('scheme')) == 'https'
      - (__bind_zone.source.url | ansible.builtin.urlsplit('hostname')) | length > 0
      - (__bind_zone.source.timeout | default(30)) > 0
    fail_msg: "Zone {{ __bind_zone.name }}: source requires a primary zone, an HTTPS URL and a positive timeout."
    quiet: true
  loop: "{{ bind_zones }}"
  loop_control:
    loop_var: __bind_zone
    label: "{{ __bind_zone.name }}"
  when: __bind_zone.source is defined

- name: "BIND | Validate response policy declaration"
  ansible.builtin.assert:
    that:
      - bind_response_policy.zones is defined
      - >-
        not (bind_response_policy.zones | default([])) or
        bind_options | selectattr('name', 'defined') |
        selectattr('name', 'equalto', 'response-policy') | list | length == 0
    fail_msg: "Response policy requires zones and must not also be declared in bind_options."
    quiet: true
  when: bind_response_policy | length > 0

- name: "BIND | Validate response policy zone references"
  ansible.builtin.assert:
    that:
      - >-
        bind_zones | selectattr('name', 'equalto', __bind_policy.name) |
        selectattr('type', 'in', ['primary', 'secondary']) | list | length == 1
      - __bind_policy.cname is not defined or __bind_policy.policy | default('given') == 'cname'
    fail_msg: >-
      Response policy {{ __bind_policy.name }}: name must reference exactly one primary or secondary;
      cname is only valid with policy: cname.
    quiet: true
  loop: "{{ bind_response_policy.zones | default([]) }}"
  loop_control:
    loop_var: __bind_policy
    label: "{{ __bind_policy.name }}"
