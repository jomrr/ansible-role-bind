---
# role: bind
# file: defaults/main.yml

# TSIG key files rendered below the platform configuration directory.
bind_tsig_keys: []
# bind_tsig_keys:
#   - name: ddns
#     algorithm: "hmac-sha256"
#     secret: vault_secret

# Additional named ACLs or complete same-name replacements of the internal ACLs.
bind_acls: []
# bind_acls:
#   - name: local
#     entries:
#       - localhost
#       - 10.53.0.0/24

# Named primaries lists used by secondary zones.
bind_primaries: []
# bind_primaries:
#   - name: samba-dlz
#     entries:
#       - 10.53.0.10

# Entries rendered inside the BIND controls block.
bind_controls: []
# bind_controls:
#   - inet 127.0.0.1 port 953 allow { 127.0.0.1; } read-only yes

# BIND TLS blocks referenced by encrypted listeners or TLS zone transfers.
bind_tls: []
# bind_tls:
#   - name: resolver-tls
#     cert_file: /etc/pki/tls/certs/named.crt
#     key_file: /etc/pki/tls/private/named.key
#     protocols:
#       - TLSv1.3
#       - TLSv1.2
#     session_tickets: false

# BIND HTTP blocks referenced by DNS-over-HTTPS listeners.
bind_http: []
# bind_http:
#   - name: resolver-http
#     endpoints:
#       - /dns-query
#     listener_clients: 100
#     streams_per_connection: 100

# BIND listener statements rendered inside the options block.
bind_listeners:
  - name: "listen-on"
    port: 53
    entries:
      - "127.0.0.1"
  - name: "listen-on-v6"
    port: 53
    entries:
      - "none"
# bind_listeners:
#   - name: listen-on
#     port: 853
#     tls: resolver-tls
#     entries:
#       - any
#   - name: listen-on
#     port: 443
#     tls: resolver-tls
#     http: resolver-http
#     entries:
#       - any

# Domains excluded from DNSSEC validation, including their subdomains.
bind_validate_except: []
# bind_validate_except:
#   - example.com

# Additional BIND options or complete same-name overrides of internal and platform defaults.
bind_options: []
# bind_options:
#   - name: forward
#     value: only
#   - name: forwarders
#     entries:
#       - 10.53.0.1
# Suppress a default option by replacing it with an empty value.
# bind_options:
#   - name: qname-minimization
#     value: ""
# Authoritative response rate limiting is opt-in.
# bind_options:
#   - name: recursion
#     value: "no"
#   - name: rate-limit
#     entries:
#       - responses-per-second 5
#       - referrals-per-second 5
#       - nodata-per-second 5
#       - nxdomains-per-second 5
#       - errors-per-second 5
#       - all-per-second 20
#       - window 5
#       - slip 2
#       - qps-scale 250

# Ordered response policy zones and optional global BIND RPZ modifiers.
bind_response_policy: {}
# bind_response_policy:
#   zones:
#     - name: rpz.example.com
#       policy: given
#       log: true
#       max_policy_ttl: 1h
#       recursive_only: true
#   options:
#     - qname-wait-recurse no
#     - break-dnssec no

# BIND logging channels and categories. Same-name entries replace platform defaults.
bind_logging:
  channels: []
  categories: []
# bind_logging:
#   channels:
#     - name: default_debug
#       file: data/named.run
#       file_options: versions 10 size 128m
#       severity: dynamic
#   categories:
#     - name: queries
#       channels:
#         - default_debug

# Additional top-level include files rendered after platform default includes.
bind_includes: []
# bind_includes:
#   - /etc/named.rfc1912.zones

# BIND DLZ blocks for integrations such as Samba BIND_DLZ primary mode.
bind_dlz: []
# bind_dlz:
#   - name: AD DNS Zone
#     statements:
#       - database "dlopen /usr/lib64/samba/bind9/dlz_bind9.so"

# BIND IN-class zone declarations and managed static zone file contents. Primary
# zones without source require ns_records for the authoritative zone base. Dynamic primary
# zones get a SOA/ns_records bootstrap and runtime records belong to DDNS.
# The file value is a file name only; the role places it in the platform-native
# directory selected by the zone type and dynamic flag.
bind_zones: []
# bind_zones:
#   - name: feed.rpz.example.com
#     type: primary
#     file: db.feed.rpz.example.com
#     source:
#       url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/pro.txt
#       timeout: 30
#       validate_certs: true
#     statements:
#       - allow-query { localhost; }
#   - name: example.com
#     comment: main forward zone
#     type: secondary
#     primaries:
#       - '"samba-dlz"'
#     file: db.example.com
#     allow_update_forwarding:
#       - any
#   - name: example.com
#     type: primary
#     dynamic: false
#     file: db.example.com
#     primary: ns1.example.com.
#     email: hostmaster.example.com.
#     ns_records:
#       - name: ns1.example.com.
#         addresses:
#           - { type: "A", ttl: "1h", address: "10.53.0.53" }
#     records:
#       - { name: "www", type: "A", ttl: "1h", data: "10.53.0.80" }
#   - name: 0.53.10.in-addr.arpa
#     type: primary
#     dynamic: false
#     file: db.0.53.10.in-addr.arpa
#     primary: ns1.example.com.
#     email: hostmaster.example.com.
#     ns_records:
#       - name: ns1.example.com.
#     records:
#       - { name: "53", type: "PTR", ttl: "1h", data: "ns1.example.com." }
#   - name: example.com
#     type: primary
#     dynamic: true
#     file: db.example.com
#     allow_update:
#       - key ddns
#     primary: ns1.example.com.
#     email: hostmaster.example.com.
#     ns_records:
#       - name: ns1.example.com.
#         addresses:
#           - { type: "A", address: "10.53.0.53" }
#   - name: example.com
#     type: primary
#     dynamic: true
#     file: db.example.com
#     update_policy:
#       - action: grant
#         identity: ddns
#         match_type: zonesub
#         types:
#           - A
#           - AAAA
#           - TXT
#     primary: ns1.example.com.
#     email: hostmaster.example.com.
#     ns_records:
#       - name: ns1.example.com.
#         addresses:
#           - { type: "A", address: "10.53.0.53" }

# Additional complete top-level BIND statements for unsupported edge cases.
bind_extra_statements: []
# bind_extra_statements:
#   - server 10.53.0.10 { bogus yes; }

# Default TTL for managed zone files.
bind_zone_file_ttl: "1h"
# bind_zone_file_ttl: 2h

# Default SOA refresh interval for managed zone files.
bind_zone_file_refresh: "1h"
# bind_zone_file_refresh: 2h

# Default SOA retry interval for managed zone files.
bind_zone_file_retry: "15m"
# bind_zone_file_retry: 30m

# Default SOA expire interval for managed zone files.
bind_zone_file_expire: "1w"
# bind_zone_file_expire: 2w

# Default SOA MINIMUM field for negative caching (RFC 2308).
bind_zone_file_minimum: "1h"
# bind_zone_file_minimum: 30m
